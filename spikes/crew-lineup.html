<title>Crew Style Lineup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--bg:#07090d;--fg:#d5e2ee;--dim:#7f93a6;--panel:rgba(12,17,24,.82);--line:#26333f;--cy:#19e6ff;--mg:#ff2fb4}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
#cap{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));color:var(--dim);pointer-events:none;text-shadow:0 1px 3px #000}
.lab{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;white-space:nowrap;text-shadow:0 1px 2px #000}
.lab b{color:var(--cy);margin-right:6px}.lab small{display:block;color:var(--dim);font-size:11px}
#ui{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#ui button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:38px;min-width:150px;padding:0 12px;text-align:left;cursor:pointer;touch-action:manipulation}
#ui button[aria-pressed=true]{border-color:var(--cy);box-shadow:inset 3px 0 0 var(--cy)}
#ui button:focus-visible{outline:2px solid var(--mg);outline-offset:2px}
#fps{color:var(--dim);font-variant-numeric:tabular-nums;padding-left:2px}
</style>
<canvas id="c"></canvas>
<div id="cap">Crew style lineup · drag to pan · pinch/scroll to zoom</div>
<div class="lab" id="l0"><b>A</b>Fine voxel<small>4x density · culled faces</small></div>
<div class="lab" id="l1"><b>B</b>Low-poly<small>flat-shaded primitives</small></div>
<div class="lab" id="l2"><b>C</b>Smoothed voxel<small>surface nets · smooth normals</small></div>
<div id="ui">
  <button id="bt"></button>
  <button id="ba"></button>
  <button id="bp"></button>
  <button id="bq"></button>
  <div id="fps">-- fps</div>
</div>

<script type="module">

/* ---------- ONE character spec (world units, feet at y=0, +z front) shared by A, B and C ---------- */

/* ---------- primitives -> signed distance, rasterised into a density field (shared by A and C) ---------- */
