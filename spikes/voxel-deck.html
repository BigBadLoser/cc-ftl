<title>Voxel Deck Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

<script type="module">

const PAL = [];

const haz = (x, y, z) => ((x + y + z) >> 1) & 1 ? M.yel : M.blk;

/* ---------- model library (all art is data) ---------- */
function wallModel(h, band, seed) {

    if (h < 8 && y === h - 1) return haz(x, 0, z);
    if (band && y >= 2 && y < 5) return haz(x, y, z);

const crateModel = () => new Model(5).box(0, 0, 0, 6, 6, 6, (x, y, z) => {
  const e = (x % 5 === 0) + (y % 5 === 0) + (z % 5 === 0);

const fixtureModel = () => new Model(2).box(0, 0, 0, 6, 3, 1, M.steelD).box(1, 0, 1, 5, 2, 2, M.lamp).mesh('light');
const lampModel = () => new Model(3).box(0, 0, 0, 3, 3, 1, M.steelD).box(0, 0, 1, 3, 3, 2, M.red).mesh('emerg');

/* Crew use finer voxels (0.5 world unit, ~13 units = 1.6 tiles tall). Limbs are separate groups pivoting at hip/shoulder; +z is front. */
const CREW1 = {skin: M.skin, hair: M.hair, shirt: M.cloth, vest: M.jacket, sleeve: M.cloth, pants: M.pants, boot: M.boot, cyber: true};

    m.box(-4, 12, -2, -2, 17, 3, c.vest).box(2, 12, -2, 4, 17, 3, c.vest).box(-4, 12, -3, 4, 18, -2, c.vest).box(-4, 18, -3, 4, 19, -1, c.vest);

/* ---------- renderer / scene / camera ---------- */

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07090d);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 900);
const target = new THREE.Vector3(56, 6, 58), DIR = new THREE.Vector3(1, 1, 1).normalize();
let viewH = 150;
