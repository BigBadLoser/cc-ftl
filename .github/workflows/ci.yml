name: CI

# CI minutes cost money, so tests run only where they can tell us something:
# - PR pushes and pushes to main: lint, typecheck, build, and only the fast tests the change can affect (Vitest's
#   import graph against the first parent: the base branch for a PR's merge commit, the previous main for a push).
#   Vitest runs everything when package.json or the Vite config changes.
# - Adding the `full-ci` label, or a manual run (workflow_dispatch): every test, slow tier (*.slow.test.ts) included.
#   This is the once-per-PR full run; remove and re-add the label to run it again.
# Markdown-only changes don't run CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# A label event the job ignores gets a group of its own, so it cannot cancel the run validating this commit.
concurrency:
  group: ci-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # adding some other label is no reason to run CI again
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (affected fast tests)
        if: ${{ !(github.event_name == 'workflow_dispatch' || github.event.action == 'labeled') }}
        run: npx vitest run --changed HEAD~1 --passWithNoTests --exclude 'src/**/*.slow.test.ts'
      - name: Test (every test, slow tier included)
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'labeled'
        run: npm test
      - name: Build
        run: npm run build
