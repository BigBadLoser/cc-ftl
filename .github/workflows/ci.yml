name: CI

# CI minutes cost money, so CI runs only what a local run can't vouch for:
# - Ready PRs: lint, typecheck, build, and only the fast tests the change can affect (Vitest's import graph against the
#   first parent: the base branch for the PR's merge commit). Vitest runs everything when package.json or the Vite
#   config changes. This checks the merge result on a clean install. Draft PRs don't run CI: open a PR as a draft while
#   review fixes go back and forth (comment `@codex review` for a Codex review, which skips drafts), and mark it ready
#   when it is; CI then runs on that and on every later push.
#   Lint, typecheck, build and the tests run as parallel jobs (the repo is public, so minutes are free; wall time matters), and
#   the tests are sharded across a matrix. To make PR CI run the full suite instead, make the pull_request branch of TEST_ARGS empty.
#   The full suite is the author's job: `npm run check` after the last merge of main, pasted into the PR.
# - Pushes to main don't run CI: everything reaching main is a PR merge CI already checked, or a markdown-only change.
# - Daily on main (only if main changed in the last day) and on a manual run (workflow_dispatch): every test, slow
#   tier (*.slow.test.ts) included. This catches what slips through, such as two PRs that only break together.
# Markdown-only and wiki-only changes don't run this CI (the wiki has .github/workflows/wiki-ci.yml).
# Shared src/content edits still run both.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'wiki/**', 'wiki-preview/**', '.github/workflows/wiki-ci.yml', '.github/workflows/wiki-preview.yml', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

env:
  # What PR runs test: the fast tests the change can affect. One line to switch (see above); the nightly and manual runs always run everything.
  TEST_ARGS: ${{ github.event_name == 'pull_request' && '--changed HEAD~1 --passWithNoTests --exclude=**/*.slow.test.ts' || '' }}

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.fresh.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The daily run skips itself when main has no commit from the last 24 hours.
      - name: Needed?
        id: fresh
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 86400 ]; then
            echo "main unchanged for a day: skipping"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # --changed compares against the first parent (the base branch for the PR's merge commit); the shards split whatever it selects.
      - name: Test (shard ${{ matrix.shard }}/4)
        run: npx vitest run --shard=${{ matrix.shard }}/4 --passWithNoTests $TEST_ARGS
