name: CI

# Every run does lint, typecheck, the fast tests and the build. The slow tier (*.slow.test.ts) is expensive, so it
# runs once per PR: on the run that adding the `full-ci` label starts (to run it again after later pushes, remove
# and re-add the label). Pushes to main run the fast tier only; run the workflow by hand (workflow_dispatch) for a
# full run on main. Markdown-only changes don't run CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# A label event the job ignores gets a group of its own, so it cannot cancel the run validating this commit.
concurrency:
  group: ci-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # adding some other label is no reason to run CI again
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (fast tier)
        run: npm run test:quick
      - name: Test (slow tier)
        if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci')
        run: npm run test:slow
      - name: Build
        run: npm run build
