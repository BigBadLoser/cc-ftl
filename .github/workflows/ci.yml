name: CI

# PR pushes run lint, typecheck, the fast tests and the build. The slow tier (*.slow.test.ts) runs on main,
# and on a PR once it carries the `full-ci` label (add it before merging; later pushes keep running it).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # adding some other label is no reason to run CI again
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (fast tier)
        run: npm run test:quick
      - name: Test (slow tier)
        if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: npm run test:slow
      - name: Build
        run: npm run build
