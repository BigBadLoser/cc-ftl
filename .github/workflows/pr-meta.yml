name: PR meta
# PR process rules from CLAUDE.md "Workflow" as a check (tools/prMeta.mjs): the PR body links an issue, the branch has a known
# prefix, and neither the body nor a commit message names a model. Its own workflow so that a title or body edit reruns it
# without touching CI: an edit run there would add skipped copies of every CI job, which GitHub counts as passing and which
# could hide an earlier failure. No install; drafts and markdown-only PRs included.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Every commit message, but no file contents beyond the script itself (the history holds the sprite sheets).
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools/prMeta.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The body goes in through the environment, never interpolated into the script.
      - run: node tools/prMeta.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
