name: Semantic duplicates (PR)

# Advisory scan of a pull request (#607): new semantic duplicate pairs (`npm run dup:semantic`, jscpd --semantic) with at
# least one side in a file the PR changes under src/, posted as one PR comment that later pushes update. Pairs already on
# main stay in the nightly report (dup-semantic.yml). Never fails on findings.
#
# Runs on the self-hosted `pi` runner (the agent-harness host), embedding on its NPU (embeddinggemma, as dup-semantic.yml);
# the runner keeps the embedding cache warm, so a scan embeds only the changed code. Ready PRs from this repo's own branches only: drafts are skipped as CI skips them, and a fork's
# PR never reaches that machine through this job (fork workflows also wait for approval in the repo settings).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['src/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dup-semantic-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, pi]
    timeout-minutes: 60
    steps:
      # The PR's merge commit; its first parent is the base, so HEAD^1...HEAD is exactly the PR's change.
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Scan
        env: { JSCPD_SEMANTIC_URL: 'http://127.0.0.1:8794/v1' }
        run: npm run -s dup:semantic -- --changed HEAD^1 > "$RUNNER_TEMP/report.md"
      - name: Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, 'utf8').trim();
            const marker = '<!-- dup-semantic-pr -->';
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (!report && !mine) { core.info('No new pairs touching this change.'); return; }
            const limit = 60000;
            const text = report.length > limit ? `${report.slice(0, limit)}\n\n_(cut short; run \`npm run dup:semantic -- --changed origin/main\`)_` : report;
            const body = [
              marker,
              report ? text : 'No new semantic duplicate pairs touching this change any more.',
              `_Advisory, as of ${sha}. Generated by the dup-semantic-pr workflow._`,
            ].join('\n\n');
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number, body });
