name: Cloud Render Tooling

on:
  push:
    branches:
      - art/cloud-render
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tools
        run: |
          python -m py_compile tools/cloud_render.py tools/cloud-render/verify_assets.py tools/blender/sprites/build_sprites.py tools/blender/sprites/crew_build.py
      - name: Shell syntax
        run: |
          bash -n tools/cloud-render/remote.sh
          bash -n tools/cloud-render/bootstrap.sh
      - name: Smoke tests
        run: |
          python tools/cloud-render/test_cloud_render.py
