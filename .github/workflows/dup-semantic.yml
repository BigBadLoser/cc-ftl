name: Semantic duplicates

# Nightly report of functions that do the same thing written differently (`npm run dup:semantic`, jscpd --semantic), with the
# embeddings on the agent-harness host's NPU (its embedding server on 127.0.0.1:8792). Runs only on the self-hosted runner
# labelled `npu`, and only from a schedule or a manual run: never on pull requests, so a fork can't reach that machine
# through this file. New pairs go into one open issue, kept updated; a clean run leaves the issue as it is.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  # TEMPORARY: trial run from this branch before the workflow is on main. Remove before the PR.
  push:
    branches: [tools/semantic-nightly-569]

permissions:
  contents: read
  issues: write

concurrency:
  group: dup-semantic
  cancel-in-progress: false

jobs:
  report:
    runs-on: [self-hosted, npu]
    # The first run embeds every function (the cache is empty, and jscpd saves it only at the end); later runs take seconds.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm`: the runner keeps ~/.npm between runs, and jscpd keeps its embedding cache by checkout path.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Scan
        env:
          JSCPD_SEMANTIC_URL: http://127.0.0.1:8792/v1
        run: npm run -s dup:semantic > "$RUNNER_TEMP/report.md"
      - name: Post
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, 'utf8').trim();
            if (!report) { core.info('No new pairs.'); return; }
            const marker = '<!-- dup-semantic-nightly -->';
            const limit = 60000;
            const text = report.length > limit ? `${report.slice(0, limit)}\n\n_(cut short; run \`npm run dup:semantic\` for the rest)_` : report;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              'Functions that do the same thing written differently, new since the accepted baseline. Fold a real pair into its owner ("One answer per question", `docs/ARCHITECTURE.md`); accept the false ones with `npm run dup:semantic:accept` once the real ones are fixed, and commit the baseline.',
              text,
              `_[Run](${run}) on ${context.sha.slice(0, 7)}._`,
            ].join('\n\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            const open = issues.find((i) => !i.pull_request && i.body?.includes(marker));
            if (open) await github.rest.issues.update({ ...context.repo, issue_number: open.number, body });
            else await github.rest.issues.create({ ...context.repo, title: 'Semantic duplicates: new pairs', body });
